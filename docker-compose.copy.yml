services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
    depends_on:
      - db
    volumes:
      - ./server/src:/app/src

  web:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./DiaNhac/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clonevocrecord
    volumes:
      - copy_db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  copy_db_data:
