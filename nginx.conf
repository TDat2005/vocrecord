server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO chat connection
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    # application/wasm: runtime ONNX cho tìm kiếm bằng ảnh (27MB, nén còn ~7MB)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|webp|avif|woff2|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
