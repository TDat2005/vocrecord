services:
  # Node.js Express API Server
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Serve React SPA (frontend) via nginx
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./DiaNhac/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

  # MySQL Database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: clonevocrecord
    # Không public MySQL ra Internet; API giao tiếp qua network nội bộ Docker.
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
